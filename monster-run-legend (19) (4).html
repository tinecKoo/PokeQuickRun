const spr=(id,back)=>{const s=SPR[(back?'b':'f')+id];return s?`<img class="sp" src="${s}" alt="">`:'<div class="sp"></div>'};
const bar=(m,id)=>`<div class="hpb"><i ${id?`id="${id}"`:''} style="width:${100*m.hp/mhp(m)}%;background:${hpc(m.hp/mhp(m))}"></i></div>`;
function roll(w,f=()=>1,lv=1){let r=Math.random()*w.reduce((a,b)=>a+b),i=0;for(;i<3&&r>=w[i];i++)r-=w[i];
 let c=M.filter(x=>x[5]==i&&f(x));while(!c.length&&i>0){i--;c=M.filter(x=>x[5]==i&&f(x))}return mk(rnd(c),lv)}
// Gacha-only roll: base (unevolved) forms only. No evolved Pokémon.
// Also excludes story-boss legendaries (Zapdos, Moltres) and Battle Pass exclusives (Gengar, Marshadow).
const GACHA_EX=[144,145,146,243,94,802,250],GTIER=[0,1,2,3];
// Evolved forms never appear in gacha — only base (unevolved) Pokémon.
const GACHA_EV=[...new Set(Object.values(EVO).map(v=>v[1]).concat([134,135,136]).filter(x=>x))];
// Stronger base forms get higher rarity (by total stats).
(function fixBaseRarity(){
  const evo=new Set(GACHA_EV);
  const bases=M.filter(x=>!evo.has(x[0]));
  const bst=x=>{const b=BS[x[0]]||[50,50,50,50];return(+x[3]||45)+(+x[4]||45)+b[0]+b[1]+b[2]+b[3]};
  const scored=bases.map(x=>[bst(x),x]).sort((a,b)=>a[0]-b[0]);
  const n=scored.length;
  scored.forEach(([,x],i)=>{
    if(GACHA_EX.includes(x[0]))return;
    const pct=n<=1?0:i/(n-1);
    x[5]=pct<.40?0:pct<.75?1:pct<.92?2:3;
  });
})();
const gachaPool=()=>M.filter(x=>!GACHA_EX.includes(x[0])&&!GACHA_EV.includes(x[0])&&x[5]<=3);
function rollG(w,lv=1){let r=Math.random()*w.reduce((a,b)=>a+b),i=0;for(;i<3&&r>=w[i];i++)r-=w[i];
 let c=M.filter(x=>x[5]==GTIER[i]&&!GACHA_EX.includes(x[0])&&!GACHA_EV.includes(x[0]));while(!c.length&&i>0){i--;c=M.filter(x=>x[5]==GTIER[i]&&!GACHA_EX.includes(x[0])&&!GACHA_EV.includes(x[0]))}return mk(rnd(c),lv)}
const card=(m,click)=>(mark(m.b[0],1),`<div class="mc r${m.b[5]}" style="--rc:${RC[m.b[5]]}"><em class="rib">${RN[m.b[5]]}</em>${spr(m.b[0])}<b>${m.b[1]}</b><div>${tps(m)}</div><div class="chips"><span>HP<b>${mhp(m)}</b></span><span>ATK<b>${Math.round(atkv(m))}</b></span><span>DEF<b>${Math.round(defv(m))}</b></span><span>SPA<b>${Math.round(spav(m))}</b></span><span>SPD<b>${Math.round(spdv(m))}</b></span><span>SPE<b>${Math.round(spev(m))}</b></span></div>${click?`<button onclick="${click}">Take</button>`:''}</div>`);
let G,B,T,DEX={},RELACTED=0,PICK_A=0,LOOT_A=0,ELM_A=0,ELI_A=0,PULL_A=0,GOT_A=0;try{DEX=JSON.parse(localStorage.getItem('mrdex')||'{}')}catch(e){}
const store=()=>{if(NET.run)return netState();try{localStorage.setItem('mrsave',JSON.stringify(G))}catch(e){}},wipe=()=>{if(NET.run)return;try{localStorage.removeItem('mrsave')}catch(e){}},save0=()=>{G.rs=0;store()};
const mark=(id,v)=>{if((DEX[id]||0)<v){DEX[id]=v;if(v==2&&M.find(x=>x[0]==id)[5]==3&&!SS.lg)sa('lg');try{localStorage.setItem('mrdex',JSON.stringify(DEX))}catch(e){}}};

 SAVE_KEYS.forEach(k=>{try{const raw=localStorage.getItem(k);if(raw!=null)data.slots[k]=JSON.parse(raw)}catch(e){try{data.slots[k]=localStorage.getItem(k)}catch(e2){}}});
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='monster-run-save-'+new Date().toISOString().slice(0,10)+'.json';

function importSaveFile(file){if(!file)return;const r=new FileReader();
 r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||typeof data!=='object'||!data.slots||typeof data.slots!=='object'){toast('Invalid save file');return}
  if(!confirm('Import this save?\\nThis overwrites your current progress (run, gacha, badges, story, coins).\\n\\nFile: '+(file.name||'save')+(data.exported?'\\nExported: '+data.exported:'')))return;
  let n=0;SAVE_KEYS.forEach(k=>{if(k in data.slots){try{localStorage.setItem(k,JSON.stringify(data.slots[k]));n++}catch(e){}}});
  try{SS=ld('mrss',{});mute=+localStorage.getItem('mrmute')?1:0}catch(e){}
  toast('Imported '+n+' slots');sfx('evo');setTimeout(()=>menu(),400);
 }catch(e){toast('Could not read save file');console.error(e)}};
 r.readAsText(file)}

const LOG=[['v2.14','Celebi added as a Legendary Starter Gacha mon (Psychic/Grass).'],['v2.13','Vaporeon nerfed: less HP and Sp. Atk, opens with Water Pulse instead of Hydro Pump (still learns Surf/Hydro Pump later).'],['v2.12','Story: enemy levels scale near your team average (not fixed sky-high). Roadside training on stages 2 and 5 (levels / tutor / heal). More XP per Story fight. Gym bosses still tough but reachable.'],['v2.11','Menu Shop: Starter Gacha duplicates now pay menu coins (not run starting coins). Spend them on starting held items and equip them on your owned starters — they begin every run with that item.'],['v2.10','STORY Act 2: Misty (Cerulean) with Staryu, Psyduck, Slowpoke, Starmie. Story is harder overall — fewer coins/balls, higher levels, stronger gym leaders. Cascade Badge on clear.'],['v2.9','Badges UI: earn 1 gym badge for each Story gym leader you defeat. Brock awards the Boulder Badge; the other seven Kanto badges are listed and unlock with future Story acts.'],['v2.8','STORY mode: Act 1 is the road to Pewter Gym. 8 stages, Gym Leader Brock at the end with his anime rock core (Geodude, Onix) plus Graveler and Golem.'],['v2.7','Battle Pass: 1 level each time you defeat an act boss (Zapdos, Moltres, Articuno) or Legend Ho-Oh — not per battle or per run start.'],['v2.6','Battle Pass levels now come from runs (1 level each time you start a run), not from individual battle wins. Existing progress was kept.'],['v2.5','LEGEND stages: a hard campaign "The Story Begins" (8 stages). Pick 3 Pokémon you own as starters. Stage 8 bosses Ho-Oh — 1% chance to unlock it after the clear. Ho-Oh added (Fire/Flying) from PokéAPI stats.'],['v2.4','Both gachas can now produce any Pokémon in the game — including the whole "evolved" tier like Gengar\'s pre-evolutions, Alakazam, Machamp and Dragonair — with two exceptions: the story-boss legendaries (Zapdos, Moltres) and the Battle Pass exclusives (Gengar, Marshadow) never appear.'],['v2.3','A partner can no longer take multiple items or Pokémon from the same offer. Elite trainers now field 4 Pokémon. In Team Battle, the stage-5 trainer fight is a shared 2v2 as well: beat 2 at a time and the trainer sends out their reserves, then you and your partner each independently choose a Pokémon to keep and an item to take.'],['v2.2','Team Battle: a second co-op mode joined the same way as before, where you and your friend fight side by side against 2 shared enemies (2 bosses on the final stage of each act) at once, choosing your own target each turn. Your teams, catches and item drops stay your own and are randomised separately for each of you.'],['v2.1','Champion Clash: after both co-op players clear Act 2, your fully healed teams battle each other live, move for move. Battle Pass with 50 levels earned from lifetime wins — most levels give a Starter Gacha spin, every 5th gives 5 spins, level 25 unlocks Gengar and level 50 unlocks the mythic Marshadow, both only obtainable this way.'],['v2.0','Treasure medals: one hidden medal per stage (16 total across both acts), with a 10% chance to find it when you win that stage\'s battle. Every 8 medals you own gives a permanent +10% damage bonus for your Pokémon, in every run. New Treasure tab on the menu to see which medals you have found.'],['v1.9','Co-op runs for 2 players over the internet: host a room, share the 4-letter code, and you both get the same events, enemies, offers and loot with your own teams. The run moves on when you are both done with a stage. Emote buttons, partner status and a shared results screen.'],['v1.8','Official evolution levels (Charmander 16, Charmeleon 36, Pidgey 18 and so on) with a new level curve: winners gain 2 to 5 levels and the team shares XP. Boosting and status moves (Swords Dance, Calm Mind, Sleep Powder, Toxic, Recover and more). Elite Trainer on stage 5: beat 3 Pokémon, get a full heal, keep one of theirs and pick an item. Phone support with a touch layout. Start a new run for the new level curve.'],['v1.7','Battle backgrounds are now pixel-art scenes that change with the enemy (meadow, forest, shore, volcano, storm, snow, cave, night) with rain, snow and embers. The Move Tutor now upgrades one of your moves into a stronger version (Ember to Flamethrower to Fire Blast).'],['v1.6','Your Pokémon and its panel are on the left, the enemy on the right. New look: stage progress pips and coin pills in the top bar, new Pokémon cards with rarity glow and stat chips, a proper main menu, event banners with Pokémon, progress bars, and smoother screens.'],['v1.5','Battle screen redesigned like the DS games: enemy top-right, your Pokémon bottom-left, message box and FIGHT / BAG / POKéMON / RUN buttons. Items are now stored in a Bag (Potions, Rare Candies and held items) and can be given, swapped or taken back from the Team and Bag screens.'],['v1.4','Quick Attack, Mach Punch, Ice Shard and Extreme Speed now go first. Pokédex is in number order. Starter Gacha odds are 70/27/2/1. Finishing or losing a run gives 1 gacha spin for every 2 stages cleared (out of 24).'],['v1.3','Every Pokémon has 4 moves (Charizard has Fire Blast, Dragon Claw, Wing Attack and Slash) with PP. New Move Tutor event teaches anime moves. Reorder your team from the Team button. 50 new Gen 1 Pokémon (Gengar, Alakazam, Machamp, Lapras, Mew and more), poison and paralysis effects.'],['v1.2','Real types for every Pokémon (dual types like Moltres fire/flying), the full 17-type chart with x4 and immunities, STAB damage bonus, and correct move types (Gust and Wing Attack are flying, Confusion is psychic, Blizzard is ice, and so on).'],['v1.1','Full stats for every Pokémon: HP, Attack, Defense, Sp. Atk, Sp. Def and Speed. Moves are physical or special, defense reduces damage, and the faster Pokémon attacks first. Stat bars in the Pokédex.'],['v1.0','Unique anime moves for every Pokémon (drain, recoil and burn effects). Act 2 with a fire boss (Moltres). Achievements you can claim for Starter Gacha spins, the Starter Gacha (60/34/5/1) to unlock new starters, and a Menu button during runs.'],['v0.9','Held items: win a battle, get a random item, give it to one monster (one item each). Battle animations, screen shake, damage numbers, catch animation and sound effects. 1% chance for Zapdos to unlock as a starter after beating it.'],['v0.8','Evolution (level-based, Eevee picks a random Eeveelution), Poké Mart shop event, coin counter, new move buttons, and a lightning boss. Each stage is now one event followed by a battle.'],['v0.7','Your run now saves in the browser (Continue on the menu). New pixel fishing scene with a trainer on a dock.'],['v0.6','Added the Pokédex, this update log and a main menu.'],['v0.5','New look inspired by PokéRogue: red-framed panels, blue and teal backdrop, pixel font.'],['v0.4','Game now fills the whole screen; text and sprites scale with the window.'],['v0.3','Pixel sprites for all 27 Pokémon (front and back) are built into the file and work offline.'],['v0.2','Fishing minigame, gacha with rarities, and choose-1-of-3 events.'],['v0.1','First playable build: 8 stages of random events, catching, type chart, boss fight.']];

function legendRematchPick(){const prog=ld(LEG_SAVE,{cleared:0});if((prog.cleared||0)<8)return legendTab();

 if(ownIds.length<3)return legendTab();

 const bossLv=18+3*8+8, remLv=Math.max(5,bossLv-10);

 const cards=pool.map((m,i)=>{const on=sel.includes(i);return '<div class="mc" style="border-color:'+(on?'#ffd23f':'#6a5a80')+';cursor:pointer" onclick="legToggle('+i+')">'+spr(m.b[0])+'<b>'+m.b[1]+'</b><small>L'+m.lv+'</small>'+(on?'<em class="up">Selected</em>':'')+'</div>'}).join('');

 if(_legRematch)return legendRematchStart();

 const team=_legSel.map(i=>{const m=_legPool[i];const c={b:m.b,lv:m.lv};c.hp=mhp(c);ens(c);applyLoadout(c);return c});
 G={act:1,stage:8,coins:0,balls:2,bag:{},team,stats:{startCoins:0,maxDmg:0,maxMv:'',maxMon:'',wins:0,catches:0,medals:0,faints:0},legend:1,legRematch:1,rs:1};
 B=null;
 const e=mk(M.find(x=>x[0]==250),bossLv);e.bm=1.55;e.hp=mhp(e);mark(250,1);
 G.team.forEach(m=>{ens(m);m.pps=m.mv.map(ppOf);m.su=0;m.sb=0;m.bn=0;m.pz=0;m.sl=0;m.sg=null});
 B={e,i:G.team.findIndex(m=>m.hp>0),boss:1,live:1,intro:1,legend:1,legRematch:1};

 bt('Rematch! Ho-Oh returns in sacred fire! Your team is 10 levels under.')}

 // denser combat: stage 5 elite, others mostly battle with occasional shop/camp
 if(G.stage==5)return elite();
 if(G.stage==3||G.stage==6){const r=Math.random();if(r<.4)return camp();if(r<.7)return shop();return pick()}
 return legendBattle(0)}

 let e;
 if(boss){e=mk(M.find(x=>x[0]==250),lv);e.bm=1.55;e.hp=mhp(e);mark(250,1)}
 else{const maxR=st>5?3:st>3?2:1;e=mk(rnd(M.filter(x=>x[5]<=maxR||(st>4&&x[5]==4))),lv);autoEvo(e);if(st>=6){e.bm=1.15;e.hp=mhp(e)}mark(e.b[0],1)}
 G.team.forEach(m=>{ens(m);m.pps=m.mv.map(ppOf);m.su=0;m.sb=0;m.bn=0;m.pz=0;m.sl=0;m.sg=null});
 B={e,i:G.team.findIndex(m=>m.hp>0),boss:!!boss,live:1,intro:1,legend:1};
 bt(boss?`The rainbow guardian Ho-Oh descends! Sacred fire fills the sky!`:`A powerful wild ${e.b[1]} blocks the legend path!`)}

  let ho=tryLegendUnlock(250,'Ho-Oh','#ffd23f');if(!ho){const o=ld('mrown',[]);ho=o.includes(250)?'<p>Ho-Oh nods to a worthy challenger.</p>':''}

  A.innerHTML='<div class="box"><h2 style="color:#ffd23f">Rematch won!</h2><p>'+m+'</p>'+ho+'<p>'+lu+'</p><p>+2 Starter Gacha spins.</p><div class="row">'+G.team.map(x=>card(x)).join('')+'</div><button onclick="legendTab()">Legend</button><button onclick="menu()">Menu</button></div>';return}
 if(boss){G.team.forEach(x=>{x.hp=mhp(x);x.bn=0;x.pz=0;x.sl=0;x.sg=null});
  let ho=tryLegendUnlock(250,'Ho-Oh','#ffd23f');if(!ho){const o=ld('mrown',[]);ho=o.includes(250)?'<p>Ho-Oh acknowledges a fellow legend-bearer.</p>':''}

 save0();scr('Victory!',`<p>${m}</p><div class="row">${spr(p.b[0])}</div><p>+${c} coins.<br>${lu}</p><button onclick="legendLoot()">Continue</button>`)}

 scr('Item found!',`<div class="shopi"><i class="itm big" style="background:${x[2]}"></i><b>${x[0]}</b><small>${x[1]}</small></div><p>Bag it or equip now.</p><div class="row">${G.team.map((m,j)=>`<button onclick="legGive(${j})">${m.b[1]}</button>`).join('')}</div><button onclick="legStow()">Store in bag</button>`)}
